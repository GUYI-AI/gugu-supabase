name: Notify source sync
on:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: source-sync-notify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notify:
    # Official installations opt in without putting private deployment config
    # into the community repository. Forks have no destination or credential.
    if: vars.BACKEND_SYNC_DISPATCH_REPOSITORY != '' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        env:
          DESTINATION: ${{ vars.BACKEND_SYNC_DISPATCH_REPOSITORY }}
          DISPATCH_TOKEN: ${{ secrets.BACKEND_SYNC_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.BACKEND_SYNC_DISPATCH_TOKEN }}
          retries: 0
          script: |
            if (!process.env.DISPATCH_TOKEN) throw new Error('Missing source sync dispatch credential');
            const target = process.env.DESTINATION;
            if (!/^[-\w]+\/[-\w]+$/.test(target)) throw new Error('Invalid source sync destination');
            if (!['refs/heads/dev', 'refs/heads/main'].includes(context.ref) || !/^[a-f0-9]{40}$/.test(context.sha) || /^0{40}$/.test(context.sha)) throw new Error('Invalid source push');
            const [owner, repo] = target.split('/');
            await github.rest.repos.createDispatchEvent({owner, repo, event_type: 'backend-source-push', client_payload: {
              repository: `${context.repo.owner}/${context.repo.repo}`, ref: context.ref, sha: context.sha, run_id: context.runId
            }});
            core.info(`Sent ${context.ref} source sync wake-up for ${context.sha}`);
