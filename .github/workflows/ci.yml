name: Community backend
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enforced: ${{ steps.source.outputs.enforced }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Locate the migration check in the trusted source
        id: source
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -eu
          script=trusted/scripts/ci/migration-versions.mjs
          allowlist=trusted/scripts/ci/migration-version-allowlist.json
          if test -f "$script" && test -f "$allowlist"; then
            echo 'enforced=true' >> "$GITHUB_OUTPUT"
          elif test ! -e "$script" && test ! -e "$allowlist"; then
            if test "$GITHUB_EVENT_NAME" = pull_request; then
              latest=$(git -C trusted rev-parse --verify "refs/remotes/origin/$BASE_BRANCH^{commit}")
              if git -C trusted cat-file -e "$latest:scripts/ci/migration-versions.mjs" 2>/dev/null || git -C trusted cat-file -e "$latest:scripts/ci/migration-version-allowlist.json" 2>/dev/null; then
                echo '::error::The target branch now has the checker. Synchronize this PR to obtain a current base event.'
                exit 1
              fi
            fi
            echo 'enforced=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Migration versions not enforced: the base has no checker yet. Independent review is required for bootstrap.'
          else
            echo '::error::Incomplete migration checker in trusted source.'
            exit 1
          fi
  migration-versions:
    needs: migration-source
    if: needs.migration-source.outputs.enforced == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: trusted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: trusted/.node-version
      - name: Check PR migration versions against branches and open PRs
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/migration-versions.mjs --pull-request
      - name: Check migration versions in the complete committed tree
        if: github.event_name != 'pull_request'
        env:
          TREE_SHA: ${{ github.sha }}
        run: node scripts/ci/migration-versions.mjs --tree "$TREE_SHA"
  unit:
    needs: [migration-source, migration-versions]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the migration version check to pass
        env:
          MIGRATION_SOURCE_RESULT: ${{ needs.migration-source.result }}
          MIGRATION_ENFORCED: ${{ needs.migration-source.outputs.enforced }}
          MIGRATION_CHECK_RESULT: ${{ needs.migration-versions.result }}
        run: |
          set -eu
          test "$MIGRATION_SOURCE_RESULT" = success
          if test "$MIGRATION_ENFORCED" = true; then
            test "$MIGRATION_CHECK_RESULT" = success
          else
            test "$MIGRATION_ENFORCED" = false
            test "$MIGRATION_CHECK_RESULT" = skipped
            echo '::notice::Migration versions not enforced during bootstrap; this is not a successful collision check.'
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test candidate migration checker offline
        run: node --test tests/ci/migration-versions.test.mjs
      - run: pnpm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.4
      - run: pnpm check:functions
      - run: deno test --allow-env --allow-sys tests/deno/ossDirectUrl.test.ts tests/deno/textFileIngest.test.ts
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GUGU_INSTALL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
      # Neither Supabase mirror holds up from hosted runners: public.ecr.aws runs out of the anonymous
      # quota those runner IPs share ("toomanyrequests: Data limit exceeded"), and GHCR caps pulls per
      # publishing organization, so every pull of a Supabase image anywhere draws on one budget
      # ("toomanyrequests: ... allowed: 44000/minute"). Take the Docker Hub originals through
      # Google's Docker Hub cache instead; the daemon falls back to Docker Hub for anything uncached.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$config"
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'
      - run: pnpm test:db:start
      - run: pnpm test:installation
      - run: pnpm test:integration
      - if: ${{ always() }}
        run: pnpm test:db:stop
